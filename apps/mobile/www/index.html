<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HireQuest</title>
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #0b1220;
        color: #e6f0ff;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;

      code {
        background: rgba(255, 255, 255, 0.08);

    <div>
      <h1>HireQuest Mobile Shell</h1>

      <p>Set the URL and run <code>npm run cap:sync</code>.</p>
    </div>

</html>
